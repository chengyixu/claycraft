<header><h1>The woodland courier</h1></header>
<canvas aria-label="Animated clay courier and mushroom props"></canvas>
<footer><nav aria-label="Preview action"></nav><p>← → move · Shift to run · Space to jump</p></footer>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { dressWoodland } from './woodland.js';

const loader = new GLTFLoader();
const [courier, mushroom] = await Promise.all([
  loader.loadAsync('./courier.glb'), loader.loadAsync('./mushroom.glb')
]);
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const contact = dressWoodland(scene);
const camera = new THREE.OrthographicCamera();
camera.position.set(.95, 1.83, 6);
camera.lookAt(0, 0.69, 0);
scene.add(new THREE.HemisphereLight(0xfff5e5, 0xb6ac98, 1.32));
const sun = new THREE.DirectionalLight(0xffedcf, 2.15);
sun.position.set(-3, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera,{left:-3.5,right:3.5,top:2.5,bottom:-2.5,near:.1,far:12});
sun.shadow.normalBias = 0.003;
sun.shadow.radius = 5;
sun.shadow.blurSamples = 8;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffcc90,1.7);
rim.position.set(2,3,-3);
scene.add(rim,courier.scene);
for (const [horizontal, depth, scale] of [[-1.21,.16,.94],[-.98,.23,.61],[-1.36,.27,.38],[1.17,-.12,.72],[1.29,-.03,.45]]) {
  const prop = mushroom.scene.clone();
  prop.position.set(horizontal, 0, depth);
  prop.scale.setScalar(scale);
  scene.add(prop);
}
scene.traverse(node => { if (node.isMesh && node !== contact) node.castShadow = node.receiveShadow = true; });
const mixer = new THREE.AnimationMixer(courier.scene);
const actions = Object.fromEntries(courier.animations.map(clip => [clip.name, mixer.clipAction(clip)]));
const keys = new Set();
let current;
let jumpTime = 0;
function select(name, restart = false) {
  if (name === current && !restart) return;
  if (current) actions[current].fadeOut(0.09);
  current = name;
  const action = actions[name];
  const once = name === 'Jump' || name === 'Wave';
  action.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
  action.clampWhenFinished = once;
  action.fadeIn(0.09).play();
  jumpTime = 0;
  for (const button of document.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.textContent === name));
  }
}
function movement() {
  if (keys.has('ArrowLeft') === keys.has('ArrowRight')) return 'Idle';
  return keys.has('Shift') ? 'Run' : 'Walk';
}
mixer.addEventListener('finished', event => { if (event.action === actions[current]) select(movement()); });
for (const name of ['Idle', 'Walk', 'Run', 'Jump', 'Wave']) {
  const button = document.createElement('button');
  button.textContent = name;
  button.onclick = () => select(name, true);
  document.querySelector('nav').append(button);
}
select('Idle');
for (const type of ['keydown', 'keyup']) {
  window.addEventListener(type, event => {
    if (!['ArrowLeft', 'ArrowRight', 'Shift', ' '].includes(event.key)) return;
    if (event.key === ' ' && event.target.tagName === 'BUTTON') return;
    event.preventDefault();
    if (event.repeat) return;
    if (type === 'keydown') keys.add(event.key);
    else keys.delete(event.key);
    if (event.key === ' ' && type === 'keydown' && current !== 'Jump') select('Jump');
    else if (current !== 'Jump' && current !== 'Wave') select(movement());
  });
}
window.addEventListener('blur', () => { keys.clear(); select('Idle'); });
function resize() {
  const width = window.innerWidth, height = window.innerHeight;
  const span = Math.max(2.45, 2.85 * height / width);
  camera.top = span / 2; camera.bottom = -camera.top;
  camera.right = camera.top * width / height; camera.left = -camera.right;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}
window.addEventListener('resize', resize);
resize();
let previous = performance.now();
renderer.setAnimationLoop(now => {
  const delta = Math.max(0, Math.min((now - previous) / 1000, 0.05));
  previous = now;
  const direction = Number(keys.has('ArrowRight')) - Number(keys.has('ArrowLeft'));
  courier.scene.position.x = THREE.MathUtils.clamp(courier.scene.position.x + direction * delta * (keys.has('Shift') ? 1.4 : 0.7), -1.85, 1.85);
  courier.scene.rotation.y = THREE.MathUtils.damp(courier.scene.rotation.y, direction * 1.38, 11, delta);
  jumpTime += delta;
  courier.scene.position.y = current === 'Jump' ? 0.35 * Math.sin(Math.PI * THREE.MathUtils.clamp((jumpTime - 0.17) / 0.66, 0, 1)) : 0;
  contact.position.x = courier.scene.position.x;
  contact.material.opacity = 1 - Math.min(.80, courier.scene.position.y * 1.8);
  mixer.update(delta);
  renderer.render(scene, camera);
});
</script>
